<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);padding:20px}
.card{width:min(100%,390px);background:#fff;border-radius:18px;padding:34px;box-shadow:0 20px 55px #0005}
h1{text-align:center;color:#172554;margin:0 0 8px}.sub{text-align:center;color:#64748b;margin:0 0 28px}
label{display:block;font-weight:600;color:#334155;margin:15px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
input:focus{outline:2px solid #93c5fd;border-color:#2563eb}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#2563eb;color:#fff;
font-size:16px;font-weight:700;cursor:pointer}button:hover{background:#1d4ed8}
#error{color:#dc2626;text-align:center;min-height:20px;margin:12px 0 0;font-size:14px}
#confirmed{display:none;text-align:center;font-size:32px;font-weight:700;color:#15803d;padding:35px 0}
</style>
</head>
<body>
<main class="card">
  <section id="login">
    <h1>Welcome Back</h1>
    <p class="sub">Sign in to continue</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Login</button>
      <p id="error" role="alert"></p>
    </form>
  </section>
  <section id="confirmed" role="status" aria-live="polite">Confirmed</section>
</main>
<script>
/*
  DEMO ONLY: credentials are visible in this browser file and are not secure.
  Replace this check with a server-side authentication endpoint before deployment.
*/
const DEMO_USERNAME = "admin";
const DEMO_PASSWORD = "12345";

document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");

  if (username === DEMO_USERNAME && password === DEMO_PASSWORD) {
    document.getElementById("login").style.display = "none";
    document.getElementById("confirmed").style.display = "block";
  } else {
    error.textContent = "Incorrect username or password. Please try again.";
  }
});
</script>
</body>
</html>
